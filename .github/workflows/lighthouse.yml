name: Lighthouse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lighthouse:
    name: Core Web Vitals (lab)
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_must_replace_in_production_00
      CLERK_SECRET_KEY: sk_test_placeholder_must_replace_in_production_00000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build packages and web app
        run: |
          npx turbo run build --filter=@fortnite-live-countdown/types --filter=@fortnite-live-countdown/utils --filter=@fortnite-live-countdown/ui
          npx turbo run build --filter=web

      - name: Start production server
        working-directory: apps/web
        run: |
          # Bind explicitly; keep logs if readiness fails.
          nohup npm run start -- -H 0.0.0.0 -p 3000 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid

      - name: Wait for Next.js
        run: |
          # Probe a public route (not `/`, which hits Clerk protect).
          for i in $(seq 1 120); do
            if curl -sf "http://127.0.0.1:3000/robots.txt" > /dev/null; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Next.js did not become ready in 120s"
          echo "=== next start log ==="
          cat /tmp/next-start.log || true
          exit 1

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/web/lighthouserc.json
          uploadArtifacts: true
